<!doctype html>
<!--J'initialise mon code avec la balise HTMl-->
<html lang="fr"> <!--lang est un attribut pour désigner la langue-->

    <head><!--l'entête de la page-->

        <meta charset="UTF-8"><!--charset est un attribut qui permet d'ajouter des accents, 
        appostrophes... sur nos textes-->
        <title>Service</title>
        <!--J'importe mon fichier service.css -->
        <!--L'attribut rel précise le type de lien et l'attribut href précise la source 
        du fichier et de récupérer le fichier-->
        <link href="service.css" rel="stylesheet">
    
    </head><!--Ici, c'est la fin de mon entête-->

    <body><!--Le corps de la page, c'est-à-dire ce que contient la page web-->

        <div id="div"><!--Elle permet de créer une section/une division. 
            Quand il y a plusieurs div, on met sur chacun un "id"-->
            <p>
                J'apprends le langage HTML. 
                J'utilise CSS pour mettre en forme ma page web.
            </p><!--Paragraphe-->

            <br>

        </div>
        <br>
        
        <div id="div2">
            <p>
                I am the boss
            </p>
            
        </div>
        <br>
        <div id="div3">
            <p>
                Not listen to badmind talk
                Or the messages that people send
            </p>
        </div>
        <br>
        <div id="div4">

            </p>
        </div>

    </body>
    
</html>
